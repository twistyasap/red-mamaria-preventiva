{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Prevención Salud Mamaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/media/imagenes_mamarias/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'prevencion/css/estilos.css' %}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow border-0 p-4" style="max-width: 400px; width: 100%;">
        <div class="card-body">
            <h3 class="text-center text-primary fw-bold mb-3">Crear Cuenta</h3>
            <p class="text-muted text-center small mb-4">Ingresa tus datos para registrarte en la plataforma</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger p-2 small">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST" data-validar>
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label font-weight-bold">Nombre de usuario</label>
                    <input type="text" name="username" id="username" class="form-control" required data-nombre="Nombre de usuario" placeholder="Ej: maria123" value="{{ datos.username|default:'' }}">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" name="email" id="email" class="form-control" required data-nombre="Correo Electrónico" placeholder="correo@ejemplo.com" value="{{ datos.email|default:'' }}">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" name="password" id="password" class="form-control" required data-nombre="Contraseña" placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Registrarse</button>
            </form>

            <div class="text-center mt-3">
                <small class="text-muted">¿Ya tienes cuenta? <a href="{% url 'iniciar_sesion' %}" style="color: #7c3aed;">Inicia sesión aquí</a></small>
            </div>
        </div>
    </div>
    <script src="{% static 'prevencion/js/animaciones.js' %}"></script>
    <script src="{% static 'prevencion/js/validacion_formularios.js' %}"></script>
</body>
</html>
